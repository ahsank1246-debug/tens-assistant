<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BOT_NAME}}</title>
<style>
  :root { --blue:#1f3a8a; --blue2:#2f55c9; --bg:#eef1f8; --me:#2f55c9; --bot:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg);
         display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .chat { width:100%; max-width:480px; height:100vh; max-height:720px; background:#fff; display:flex;
          flex-direction:column; border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(31,58,138,.18); }
  header { background:linear-gradient(135deg,var(--blue),var(--blue2)); color:#fff; padding:16px 18px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12px; opacity:.9; }
  #log { flex:1; overflow-y:auto; padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .me  { background:var(--me); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px 0; background:var(--bg); }
  .chip { border:1px solid var(--blue2); color:var(--blue2); background:#fff; padding:6px 12px; border-radius:20px;
          font-size:13px; cursor:pointer; }
  .chip:hover { background:var(--blue2); color:#fff; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #e3e7f1; background:#fff; }
  input { flex:1; min-width:0; padding:12px 14px; border:1px solid #ccd3e4; border-radius:24px; font-size:15px; outline:none; }
  input:focus { border-color:var(--blue2); }
  button.send { background:var(--blue2); color:#fff; border:0; border-radius:24px; padding:0 20px; font-size:15px; cursor:pointer; }
  .typing { color:#8a93ad; font-size:13px; align-self:flex-start; }
  footer { text-align:center; font-size:11px; color:#8a93ad; padding:8px; background:#fff; }
  footer a { color:var(--blue2); }
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>Tens Sourcing - {{BOT_NAME}}</h1>
    <p>Ask about leave, office timings, HR and IT</p>
    <p>Office Hours: Monday to Friday, 9:30 AM – 6:30 PM</p>
  </header>

  <div id="log"></div>

  <div class="chips" id="chips">
    <button class="chip" data-q="I need to apply for leave">Leave Request</button>
    <button class="chip" data-q="What are the office timings?">Office Timings</button>
    <button class="chip" data-q="Salary question">Salary</button>
    <button class="chip" data-q="WiFi password">WiFi</button>
    <button class="chip" data-q="How do I contact HR?">HR</button>
    <button class="chip" data-q="Who should I contact for other questions?">Other Questions</button>
  </div>

  <form id="form" autocomplete="off">
    <input id="input" placeholder="Type your question here..." maxlength="500">
    <button class="send" type="submit">Send</button>
  </form>

  <footer>
    Tens Sourcing &middot;
    <a href="/leaves" target="_blank">View Leave Requests</a>
    <br>
    Other questions:
    <a href="mailto:sehrish.hanif@tenssourcing.com">Sehrish Hanif</a>
  </footer>
</div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");

  let session = "";
  try { session = sessionStorage.getItem("sid") || ""; } catch (e) {}

  if (!session) {
    session = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem("sid", session); } catch (e) {}
  }

  function add(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function normalize(text) {
    return text.toLowerCase().replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
  }

  function localAnswer(text) {
    const q = normalize(text);

    const timingQuestion =
      q.includes("office timing") ||
      q.includes("office hour") ||
      q.includes("working hour") ||
      q.includes("work timing") ||
      q.includes("when does the office") ||
      q.includes("what time does the office") ||
      q === "timings" ||
      q === "timing";

    if (timingQuestion) {
      return "Tens Sourcing office hours are Monday to Friday, 9:30 AM to 6:30 PM. The office is closed on Saturday and Sunday.";
    }

    const contactQuestion =
      q.includes("sehrish") ||
      q.includes("contact hr") ||
      q.includes("hr email") ||
      q.includes("contact email") ||
      q.includes("other question") ||
      q.includes("other query") ||
      q.includes("who should i contact") ||
      q.includes("who do i contact") ||
      q.includes("email address");

    if (contactQuestion) {
      return "For other questions or assistance, please contact Sehrish Hanif at sehrish.hanif@tenssourcing.com.";
    }

    return null;
  }

  async function send(text) {
    if (!text.trim()) return;

    add(text, "me");

    const answer = localAnswer(text);
    if (answer !== null) {
      add(answer, "bot");
      return;
    }

    const t = document.createElement("div");
    t.className = "typing";
    t.textContent = "Typing...";
    log.appendChild(t);
    log.scrollTop = log.scrollHeight;

    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, message: text })
      });

      if (!r.ok) throw new Error("Server request failed");

      const j = await r.json();
      t.remove();

      add(
        typeof j.reply === "string"
          ? j.reply
          : "I could not process that response. Please try again.",
        "bot"
      );
    } catch (e) {
      t.remove();
      add(
        "I could not connect to the assistant. Please try again or contact Sehrish Hanif at sehrish.hanif@tenssourcing.com.",
        "bot"
      );
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value;
    input.value = "";
    send(v);
  });

  document.querySelectorAll(".chip").forEach(c =>
    c.addEventListener("click", () => send(c.dataset.q))
  );

  send("menu");
</script>
</body>
</html>
