<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BOT_NAME}}</title>
<style>
  :root { --blue:#1f3a8a; --blue2:#2f55c9; --bg:#eef1f8; --me:#2f55c9; --bot:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg);
         display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .chat { width:100%; max-width:480px; height:100vh; max-height:720px; background:#fff; display:flex;
          flex-direction:column; border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(31,58,138,.18); }
  header { background:linear-gradient(135deg,var(--blue),var(--blue2)); color:#fff; padding:16px 18px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; font-size:12px; opacity:.85; }
  #log { flex:1; overflow-y:auto; padding:16px; background:var(--bg); display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .me  { background:var(--me); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px 0; background:var(--bg); }
  .chip { border:1px solid var(--blue2); color:var(--blue2); background:#fff; padding:6px 12px; border-radius:20px;
          font-size:13px; cursor:pointer; }
  .chip:hover { background:var(--blue2); color:#fff; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #e3e7f1; background:#fff; }
  input { flex:1; padding:12px 14px; border:1px solid #ccd3e4; border-radius:24px; font-size:15px; outline:none; }
  input:focus { border-color:var(--blue2); }
  button.send { background:var(--blue2); color:#fff; border:0; border-radius:24px; padding:0 20px; font-size:15px; cursor:pointer; }
  .typing { color:#8a93ad; font-size:13px; align-self:flex-start; }
  footer { text-align:center; font-size:11px; color:#8a93ad; padding:6px; background:#fff; }
  footer a { color:#8a93ad; }
</style>
</head>
<body>
<div class="chat">
  <header>
    <h1>{{COMPANY}} - {{BOT_NAME}}</h1>
    <p>Ask about leave, office timings, HR and IT</p>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips">
    <button class="chip" data-q="I need to apply for leave">Leave request</button>
    <button class="chip" data-q="What are the office timings?">Office timings</button>
    <button class="chip" data-q="Salary question">Salary</button>
    <button class="chip" data-q="WiFi password">WiFi</button>
    <button class="chip" data-q="How do I contact HR?">HR</button>
  </div>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Type your question here..." maxlength="500">
    <button class="send" type="submit">Send</button>
  </form>
  <footer>Demo bot &middot; <a href="/leaves" target="_blank">View leave requests</a></footer>
</div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  let session = "";
  try { session = sessionStorage.getItem("sid") || ""; } catch (e) {}
  if (!session) {
    session = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem("sid", session); } catch (e) {}
  }

  function add(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  async function send(text) {
    if (!text.trim()) return;
    add(text, "me");
    const t = document.createElement("div");
    t.className = "typing"; t.textContent = "typing...";
    log.appendChild(t); log.scrollTop = log.scrollHeight;
    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, message: text })
      });
      const j = await r.json();
      t.remove();
      add(j.reply, "bot");
    } catch (e) {
      t.remove();
      add("Could not reach the server. Please try again.", "bot");
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value;
    input.value = "";
    send(v);
  });
  document.querySelectorAll(".chip").forEach(c =>
    c.addEventListener("click", () => send(c.dataset.q)));

  send("menu");
</script>
</body>
</html>
